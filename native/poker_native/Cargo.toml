[package]
name = "poker_native"
version = "0.1.0"
edition = "2024"

[lib]
name = "poker_native"
crate-type = ["cdylib"]

[dependencies]
rs_poker = { version = "=5.1.0", default-features = false, features = ["arena", "serde"] }
rand = "0.10.1"
rustler = "=0.38.0"
tokio = { version = "1", features = ["rt"] }
